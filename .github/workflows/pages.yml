name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # build создаёт site/ и кладёт в него version.json с коммитом этого запуска
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # Проект проверяет сам себя: сверяет коммит, CI и то, что реально отдаёт опубликованный сайт.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Квитанция выпуска
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node src/cli.ts verify https://oleg4311.github.io/release-receipt/
          --sha ${{ github.sha }} --repo ${{ github.repository }} --workflow CI
          --wait 300 --interval 10 --out receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt
          path: receipt.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e на живом URL
        env:
          BASE_URL: https://oleg4311.github.io/release-receipt/
        run: npx playwright test --retries=2
